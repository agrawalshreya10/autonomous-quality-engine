name: Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: aqe-smoke:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke in container
        run: |
          mkdir -p reports
          set +e
          docker run --name aqe-smoke-run \
            -e GITHUB_ACTIONS=true \
            -e HEADLESS=true \
            -e BASE_URL=https://opensource-demo.orangehrmlive.com \
            -e ORANGEHRM_USER=Admin \
            -e ORANGEHRM_PASSWORD=admin123 \
            aqe-smoke
          status=$?
          docker cp aqe-smoke-run:/app/reports/. reports/ || true
          docker rm -f aqe-smoke-run
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: reports/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run tests
        run: |
          mkdir -p reports/screenshots
          pytest tests/ -n auto -v --tb=short --html=reports/report.html --self-contained-html
        env:
          HEADLESS: "true"

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.python-version }}
          path: reports/
          retention-days: 14

      - name: Summary on failure
        if: failure()
        run: |
          echo "## Tests failed" >> $GITHUB_STEP_SUMMARY
          echo "Download the **test-report** artifact to view the HTML report and screenshots." >> $GITHUB_STEP_SUMMARY
          echo "For AI failure analysis, use the separate AI Failure Analysis workflow or run locally:" >> $GITHUB_STEP_SUMMARY
          echo '  ./scripts/run_failure_analyzer.sh --artifacts-dir ./reports' >> $GITHUB_STEP_SUMMARY
          echo '  AI_PROVIDER=gemini ./scripts/run_failure_analyzer.sh --artifacts-dir ./reports' >> $GITHUB_STEP_SUMMARY
